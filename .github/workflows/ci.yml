name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          pip install \
            pytest==8.3.4 \
            pytest-cov==6.0.0 \
            qdrant-client==1.12.1 \
            openai==1.55.3 \
            python-dotenv==1.0.1

      - name: Run tests
        run: pytest tests/ -v --cov=scripts --cov-report=term-missing

project:
  type: default

format:
  revealjs:
    theme: default
    slide-number: c/t
    chalkboard: false
    incremental: false
    transition: fade
    footer: "M731 Marketing Research | Fall 2026 | Shay Abbasi"
    preview-links: auto
    scrollable: true
    code-overflow: wrap
    highlight-style: github
    embed-resources: true
    smaller: false
    code-line-numbers: true
    code-copy: true
    include-in-header:
      - text: |
          <style>
          .reveal .slide { text-align: left; }
          .reveal h1 { font-size: 1.6em; color: #7A003C; }
          .reveal h2 { font-size: 1.25em; color: #7A003C; }
          .reveal h3 { font-size: 1.05em; color: #FDBF57; }
          .reveal ul, .reveal ol { font-size: 0.85em; }
          .reveal .callout { font-size: 0.75em; }
          .reveal pre code { font-size: 0.7em; }
          .reveal .footer { font-size: 0.6em; color: #666; }
          .reveal .slide-number { color: #7A003C; }
          </style>

execute:
  echo: true
  warning: false
  message: false
  eval: false
